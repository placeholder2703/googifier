
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Text Googifier</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="container">
		<h1>Text Googifier</h1>

		<div class="boxes">
			<textarea id="input" placeholder="Enter text here..."></textarea>
			<textarea id="output" placeholder="Googified text appears here..." readonly></textarea>
		</div>

		
		<div class="buttons">
			<button id="convert">Convert</button>
			<button id="copy">Copy</button>
		</div>

	</div>
</body>
</html>
